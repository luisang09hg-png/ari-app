<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARI v3.0 — Aruma · Tu Asistente de Belleza</title>
  <meta name="description"
    content="ARI es tu asistente de belleza inteligente de Aruma. Analiza tu piel y te recomienda la rutina ideal con productos seleccionados por expertos.">
  <meta name="theme-color" content="#FE0182">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">

  <!-- MediaPipe FaceMesh -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body class="light-mode">

  <div class="app-bg" id="app-container">

    <!-- HEADER GLOBAL -->
    <header class="app-header">
      <div class="header-left">
        <button id="toggle-dark" class="icon-btn" aria-label="Cambiar modo oscuro"><i data-lucide="moon"></i></button>
        <button id="toggle-a11y" class="icon-btn" aria-label="Modo accesibilidad"><i
            data-lucide="a-large-small"></i></button>
        <button id="btn-catalogo" class="icon-btn" aria-label="Ver Catálogo"><i data-lucide="store"></i></button>
      </div>

      <div class="ari-logo-container" id="btn-home" style="cursor:pointer;"
        aria-label="Ir al inicio">
        <div class="ari-logo">ARI<span class="sparkle">✦</span></div>
      </div>

      <div class="header-right">
        <button id="auth-btn" class="icon-btn" aria-label="Mi cuenta">
          <i data-lucide="user" style="width:18px;height:18px;"></i>
        </button>
        <button id="cart-btn" class="cart-badge-btn" aria-label="Ver bolsa de compras">
          <i data-lucide="shopping-bag"></i>
          <span class="cart-count" id="cart-count">0</span>
        </button>
      </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL DEL ROUTER -->
    <main id="app-root" class="app-root"></main>

    <!-- FOOTER GLOBAL -->
    <footer class="app-footer" id="app-footer-wrapper" style="flex-direction: column; gap: 4px;">
      <div id="app-footer">Análisis local · Datos no guardados</div>
      <div><a href="#/privacidad" style="color:var(--color-primary); text-decoration:none; font-weight:600;">Política de Privacidad</a></div>
    </footer>





  </div>

  <!-- SCRIPTS -->
  <script src="data.js"></script>
  <script src="engine.js"></script>
  <script src="store.js"></script>
  <script src="supabaseClient.js"></script>
  <script src="screens.js"></script>
  <script src="router.js"></script>
  <script src="app.js"></script>

</body>
</html>
